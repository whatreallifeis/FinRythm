name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read  # gitleaks-action читает список коммитов PR
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - name: Эталон не изменён вручную
        run: |
          python contracts/reference_runway.py > /dev/null
          git diff --exit-code contracts/expected_results.json
      - name: Tests
        run: pytest -q || [ $? -eq 5 ]
        env: { LLM_PROVIDER: fake }
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finritm .
      - name: Образ отвечает на сценарий «демо → календарь»
        run: |
          docker run -d --name api -p 8000:8000 -e APP_TODAY=2026-09-26 finritm
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          token=$(curl -fsS -X POST localhost:8000/api/auth/demo | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST -H "Authorization: Bearer $token" localhost:8000/api/demo/seed
          curl -fsS -H "Authorization: Bearer $token" localhost:8000/api/analysis/runway > /dev/null
          curl -fsS -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" -d '{"amount": 14900}' localhost:8000/api/analysis/impulse > /dev/null
      - if: failure()
        run: docker logs api
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Сборка фронтенда из ветки front
        run: sh deploy/build-frontend.sh
      - name: Стенд целиком (caddy + api + фронтенд) по HTTP
        run: |
          grep -v -E '^(SITE_ADDRESS|BASIC_AUTH_USER|BASIC_AUTH_HASH)=' .env.example > .env
          pass=$(openssl rand -hex 16)  # одноразовый пароль стенда в CI
          hash=$(docker run --rm caddy:2 caddy hash-password --plaintext "$pass")
          printf "SITE_ADDRESS=http://localhost\nBASIC_AUTH_USER=ci\nBASIC_AUTH_HASH='%s'\n" "$hash" >> .env
          docker compose -f deploy/compose.yml --env-file .env up -d --build
          for i in $(seq 1 60); do curl -fsS localhost/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost/)" = 401
          curl -fsS -u "ci:$pass" localhost/ | grep -q '<div id="root"'
          curl -fsS -u "ci:$pass" localhost/docs > /dev/null
          token=$(curl -fsS -X POST localhost/api/auth/demo | python3 -c 'import sys, json; print(json.load(sys.stdin)["token"])')
          curl -fsS -X POST -H "Authorization: Bearer $token" localhost/api/demo/seed
          curl -fsS -H "Authorization: Bearer $token" localhost/api/analysis/runway | grep -q todaySafeSpend
      - if: failure()
        run: docker compose -f deploy/compose.yml --env-file .env logs
